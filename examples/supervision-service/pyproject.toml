[project]
name = "supervision-api"
version = "0.1.0"
description = "Video analysis API powered by supervision"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "supervision",
    "ultralytics",
    "jsonargparse[signatures]",
    "imageio-ffmpeg>=0.5",
    # PyAV provides a full ffmpeg build (incl. HEVC/H.265 decoding) used as a
    # fallback in stream_manager when OpenCV's bundled ffmpeg cannot read a
    # stream's frames (e.g. H.265 RTSP sources that VLC plays but OpenCV cannot).
    "av>=12.0",
    # torch/torchvision are pinned to the exact CUDA build (see
    # [tool.uv.sources] below) so that GPU inference works out of the box and
    # other machines reproduce the environment bit-for-bit. Without the pin,
    # plain PyPI resolution may install the CPU-only build and all
    # detection/tracking silently falls back to CPU. macOS falls back to the
    # PyPI CPU build of the same version.
    "torch==2.13.0+cu130; sys_platform == 'win32' or sys_platform == 'linux'",
    "torch==2.13.0; sys_platform != 'win32' and sys_platform != 'linux'",
    "torchvision==0.28.0+cu130; sys_platform == 'win32' or sys_platform == 'linux'",
    "torchvision==0.28.0; sys_platform != 'win32' and sys_platform != 'linux'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Tests live under tests/ and are run from this directory so that the ``app``
# package resolves without the root project's pytest config (which excludes
# examples/). pytest is provided by the root dev environment.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
