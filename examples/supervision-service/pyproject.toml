[project]
name = "supervision-api"
version = "0.1.0"
description = "Video analysis API powered by supervision"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "supervision",
    "ultralytics",
    "jsonargparse[signatures]",
    "imageio-ffmpeg>=0.5",
    # PyAV provides a full ffmpeg build (incl. HEVC/H.265 decoding) used as a
    # fallback in stream_manager when OpenCV's bundled ffmpeg cannot read a
    # stream's frames (e.g. H.265 RTSP sources that VLC plays but OpenCV cannot).
    "av>=12.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
